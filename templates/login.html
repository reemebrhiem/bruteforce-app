<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<style>
* {
    box-sizing: border-box;
}

body {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
    background: radial-gradient(circle at top, #111, #000);
    margin:0;
}

.box {
    width:320px;
    padding:30px 25px;
    border-radius:12px;
    text-align:center;
    border:2px solid white;
    background: transparent;
}

h2 {
    margin-bottom:20px;
    color:white;
    font-weight:normal;
}

input {
    width:100%;
    padding:14px;
    margin:10px 0;
    font-size:14px;
    background:transparent;
    border:2px solid white;
    border-radius:6px;
    color:white;
    text-align:center;
    outline:none;
}

input::placeholder {
    color:#ccc;
}

button {
    width:100%;
    padding:14px;
    margin-top:12px;
    font-size:15px;
    background:transparent;
    border:2px solid white;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

button:disabled {
    opacity:0.5;
    cursor:not-allowed;
}

#registerBtn {
    background:none;
    border:none;
    margin-top:14px;
    color:#bbb;
    font-size:14px;
    cursor:pointer;
}

#registerBtn:hover {
    text-decoration:underline;
    color:white;
}

#msg {
    color:#ff6b6b;
    margin-top:12px;
    font-size:14px;
}
</style>
</head>

<body>
<div class="box">
<h2>تسجيل الدخول</h2>

<form onsubmit="login(); return false;">
    <input id="username" placeholder="اسم المستخدم" required>
    <input id="password" type="password" placeholder="كلمة المرور" required>
    <button id="loginBtn" type="submit">دخول</button>
</form>

<button id="registerBtn" onclick="location.href='/register'">
    إذا ليس لديك حساب، إنشاء حساب
</button>

<div id="msg"></div>
</div>

<script>
let blocked = false;
let timerInterval = null;

window.addEventListener("keydown", function(e){
    if(blocked && (e.key === "F5" || (e.ctrlKey && e.key === "r"))){
        e.preventDefault();
    }
});
window.addEventListener("beforeunload", function(e){
    if(blocked){
        e.preventDefault();
        e.returnValue = "";
    }
});

function startTimer(seconds){
    const msg = document.getElementById("msg");
    const loginBtn = document.getElementById("loginBtn");
    const regBtn = document.getElementById("registerBtn");

    blocked = true;
    loginBtn.disabled = true;
    regBtn.disabled = true;

    let s = seconds;
    msg.innerText = " تم اكتشاف هجوم قوة غاشمة، حاول بعد " + s + " ثانية";

    timerInterval = setInterval(() => {
        s--;
        msg.innerText = " تم اكتشاف هجوم قوة غاشمة، حاول بعد " + s + " ثانية";

        if(s <= 0){
            clearInterval(timerInterval);
            blocked = false;
            loginBtn.disabled = false;
            regBtn.disabled = false;
            msg.innerText = "";
        }
    },1000);
}

function login(){
    if(blocked) return;

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");

    msg.innerText = "";

fetch("/login", {
    method: "POST",
    headers: {
        "Content-Type": "application/x-www-form-urlencoded"
    },
    body: "username=" + username + "&password=" + password
})
.then(res => res.text())
.then(text => {
    if (text === "SUCCESS") {
        location.href = "/dashboard/" + username;
    }
    else if (text.startsWith("BLOCKED")) {
        const seconds = parseInt(text.split(":")[1]);
        startTimer(seconds);
    }
    else if (text === "NO_USER") {
        msg.innerText = "الحساب غير موجود";
    }
    else if (text === "WRONG_PASSWORD") {
        msg.innerText = "كلمة المرور غير صحيحة";
    }
    else {
        msg.innerText = "حدث خطأ غير متوقع";
    }
})
.catch(() => {
    msg.innerText = "خطأ في الاتصال بالسيرفر";
});
}
</script>
</body>
</html>
