<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول</title>

<style>
* {
    box-sizing: border-box;
}

body {
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:Arial, sans-serif;
    background: radial-gradient(circle at top, #111, #000);
    margin:0;
}

.box {
    width:320px;
    padding:30px 25px;
    border-radius:12px;
    text-align:center;
    border:2px solid white;
    background: transparent;
}

h2 {
    margin-bottom:20px;
    color:white;
    font-weight:normal;
}

input {
    width:100%;
    padding:14px;
    margin:10px 0;
    font-size:14px;
    background:transparent;
    border:2px solid white;
    border-radius:6px;
    color:white;
    text-align:center;
    outline:none;
}

input::placeholder {
    color:#ccc;
}

button {
    width:100%;
    padding:14px;
    margin-top:12px;
    font-size:15px;
    background:transparent;
    border:2px solid white;
    color:white;
    border-radius:6px;
    cursor:pointer;
    transition: all 0.3s;
}

button:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.1);
}

button:disabled {
    opacity:0.5;
    cursor:not-allowed;
}

#registerBtn {
    background:none;
    border:none;
    margin-top:14px;
    color:#bbb;
    font-size:14px;
    cursor:pointer;
    width: auto;
    display: inline-block;
}

#registerBtn:hover {
    text-decoration:underline;
    color:white;
}

#msg {
    margin-top:12px;
    font-size:14px;
    min-height: 20px;
}

.msg-error {
    color: #ff6b6b;
}

.msg-warning {
    color: #ffcc00;
}

.msg-success {
    color: #4caf50;
}

.msg-blocked {
    color: #ff4444;
    font-weight: bold;
}
</style>
</head>

<body>
<div class="box">
<h2>تسجيل الدخول</h2>

<form onsubmit="login(); return false;">
    <input id="username" placeholder="اسم المستخدم" required>
    <input id="password" type="password" placeholder="كلمة المرور" required>
    <button id="loginBtn" type="submit">دخول</button>
</form>

<button id="registerBtn" onclick="location.href='/register'">
    إذا ليس لديك حساب، إنشاء حساب
</button>

<div id="msg"></div>
</div>

<script>
let blocked = false;
let timerInterval = null;

window.addEventListener("keydown", function(e){
    if(blocked && (e.key === "F5" || (e.ctrlKey && e.key === "r"))){
        e.preventDefault();
        showMessage("لا يمكن تحديث الصفحة أثناء الحظر", "warning");
    }
});

function showMessage(text, type = "error") {
    const msg = document.getElementById("msg");
    msg.innerText = text;
    msg.className = "";
    msg.classList.add(`msg-${type}`);
}

function startTimer(seconds){
    const loginBtn = document.getElementById("loginBtn");
    const regBtn = document.getElementById("registerBtn");

    blocked = true;
    loginBtn.disabled = true;
    regBtn.disabled = true;
    
    let s = seconds;
    showMessage(`تم اكتشاف هجوم قوة غاشمة، حاول بعد ${s} ثانية`, "blocked");

    if (timerInterval) clearInterval(timerInterval);
    
    timerInterval = setInterval(() => {
        s--;
        showMessage(`تم اكتشاف هجوم قوة غاشمة، حاول بعد ${s} ثانية`, "blocked");

        if(s <= 0){
            clearInterval(timerInterval);
            blocked = false;
            loginBtn.disabled = false;
            regBtn.disabled = false;
            showMessage("تم إلغاء الحظر، يمكنك المحاولة الآن", "success");
            
            setTimeout(() => {
                showMessage("", "");
            }, 3000);
        }
    }, 1000);
}

async function login(){
    if(blocked) {
        showMessage("الحساب محظور حالياً، الرجاء الانتظار", "warning");
        return false;
    }

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const loginBtn = document.getElementById("loginBtn");

    if (!username || !password) {
        showMessage("الرجاء ملء جميع الحقول", "error");
        return false;
    }

const originalText = loginBtn.textContent;
    loginBtn.disabled = true;
    loginBtn.textContent = "جاري التحقق...";
    showMessage("", "");

    try {
        const response = await fetch("/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams({
                username: username,
                password: password
            })
        });

        const result = await response.json();

        if (response.ok && result.status === "success") {
            showMessage(result.message || "تم تسجيل الدخول بنجاح", "success");
            
            setTimeout(() => {
                location.href = "/dashboard/" + encodeURIComponent(username);
            }, 1000);
        } 
        else if (response.status === 429) {
            showMessage(result.message || "تم اكتشاف نشاط مشبوه", "blocked");
            startTimer(result.seconds || 60);
        }
        else if (response.status === 404) {
            showMessage(result.message || "اسم المستخدم غير صحيح", "error");
        }
        else if (response.status === 401) {
            showMessage(result.message || "كلمة المرور غير صحيحة", "error");
        }
        else if (response.status === 403) {
            showMessage(result.message || "تم رفض الطلب بسبب استخدام أدوات آلية", "warning");
        }
        else {
            showMessage(result.message || "حدث خطأ غير متوقع", "error");
        }
    } 
    catch (error) {
        console.error("Error:", error);
        showMessage("خطأ في الاتصال بالسيرفر", "error");
    }
    finally {
        loginBtn.disabled = false;
        loginBtn.textContent = originalText;
    }

    return false;
}
</script>
</body>
</html>
