<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>إنشاء حساب</title>

<style>
* {
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at top, #111, #000);
}

.box {
    width: 320px;
    padding: 30px 25px;
    text-align: center;
    border: 2px solid white;
    border-radius: 12px;
    background: transparent;
}

h2 {
    color: white;
    margin-bottom: 20px;
    font-weight: normal;
}

input {
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    background: transparent;
    border: 2px solid white;
    border-radius: 6px;
    color: white;
    text-align: center;
    font-size: 14px;
    outline: none;
    transition: all 0.3s;
}

input:focus {
    border-color: #4caf50;
    box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
}

input::placeholder {
    color: #ccc;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    background: transparent;
    border: 2px solid white;
    color: white;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
}

button:hover:not(:disabled) {
    background: white;
    color: black;
    transform: translateY(-2px);
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    border-color: #666;
}

button::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px;
    height: 5px;
    background: rgba(255, 255, 255, 0.5);
    opacity: 0;
    border-radius: 100%;
    transform: scale(1, 1) translate(-50%);
    transform-origin: 50% 50%;
}

button.loading::after {
    animation: ripple 1s ease-out infinite;
}

@keyframes ripple {
    0% {
        transform: scale(0, 0);
        opacity: 0.5;
    }
    100% {
        transform: scale(20, 20);
        opacity: 0;
    }
}

#msg {
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
    text-align: center;
    padding: 8px;
    border-radius: 4px;
    transition: all 0.3s;
}

.msg-success {
    color: #4caf50;
    background: rgba(76, 175, 80, 0.1);
    border: 1px solid rgba(76, 175, 80, 0.3);
}

.msg-error {
    color: #ff6b6b;
    background: rgba(255, 107, 107, 0.1);
    border: 1px solid rgba(255, 107, 107, 0.3);
}

.msg-warning {
    color: #ffcc00;
    background: rgba(255, 204, 0, 0.1);
    border: 1px solid rgba(255, 204, 0, 0.3);
}

.back-link {
    display: block;
    margin-top: 15px;
    color: #bbb;
    text-decoration: none;
    font-size: 13px;
    transition: color 0.3s;
}

.back-link:hover {
    color: white;
    text-decoration: underline;
}
</style>
</head>

<body>
<div class="box">
    <h2>إنشاء حساب جديد</h2>

    <input id="username" placeholder="اسم المستخدم (3 أحرف على الأقل)" autocomplete="username">
    <input id="password" type="password" placeholder="كلمة المرور (3 أحرف على الأقل)" autocomplete="new-password">

    <button id="registerBtn" onclick="register()">تسجيل</button>
    
    <a href="/" class="back-link">← العودة إلى تسجيل الدخول</a>
    
    <div id="msg"></div>
</div>

<script>
function showMessage(text, type = "error") {
    const msg = document.getElementById("msg");
    msg.textContent = text;
    msg.className = "msg-" + type;
    msg.style.display = text ? "block" : "none";
}

async function register() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const registerBtn = document.getElementById("registerBtn");
    const msg = document.getElementById("msg");

    if (!username || !password) {
        showMessage("الرجاء ملء جميع الحقول", "error");
        return;
    }

    if (username.length < 3 || password.length < 3) {
        showMessage("اسم المستخدم وكلمة المرور يجب أن يكونا 3 أحرف على الأقل", "error");
        return;
    }

    registerBtn.disabled = true;
    registerBtn.classList.add("loading");

    showMessage("جاري إنشاء الحساب...", "warning");

    try {
        const formData = new URLSearchParams();
        formData.append("username", username);
        formData.append("password", password);

        const response = await fetch("/register", {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: formData
        });

        const resultText = await response.text();

        if (resultText === "CREATED") {
            showMessage(" تم إنشاء الحساب بنجاح! يتم تحويلك...", "success");
            
            setTimeout(() => {
                window.location.href = "/";
            }, 2000);
        } 
        else if (resultText === "EXISTS") {
            showMessage(" اسم المستخدم موجود مسبقاً", "error");
            document.getElementById("username").focus();
        }
        else if (resultText === "INVALID") {
            showMessage(" البيانات غير صالحة", "error");
        }
        else if (resultText === "ERROR") {
            showMessage(" حدث خطأ أثناء إنشاء الحساب", "error");
        }
        else {
            showMessage("حدث خطأ غير معروف: " + resultText, "error");
        }
    } 
    catch (error) {
        console.error("Error:", error);
        showMessage(" خطأ في الاتصال بالسيرفر", "error");
    }
    finally {
        registerBtn.disabled = false;
        registerBtn.classList.remove("loading");
    }
}

document.addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        register();
    }
});

document.getElementById("username").addEventListener("focus", function() {
    showMessage("أدخل اسم مستخدم فريد (3 أحرف على الأقل)", "warning");
});

document.getElementById("password").addEventListener("focus", function() {
    showMessage("أدخل كلمة مرور قوية (3 أحرف على الأقل)", "warning");
});

document.getElementById("username").addEventListener("blur", function() {
    if (!this.value.trim()) {
        showMessage("");
    }
});

document.getElementById("password").addEventListener("blur", function() {
    if (!this.value.trim()) {
        showMessage("");
    }
});
</script>
</body>
</html>
