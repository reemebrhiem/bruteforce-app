<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>إنشاء حساب</title>

<style>
*{
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    font-family:Arial, sans-serif;
    background: radial-gradient(circle at top, #111, #000);
}

.box{
    width:320px;
    padding:30px 25px;
    text-align:center;
    border:2px solid white;
    border-radius:12px;
    background:transparent;
}

h2{
    color:white;
    margin-bottom:20px;
    font-weight:normal;
}

input{
    width:100%;
    padding:14px;
    margin:10px 0;
    background:transparent;
    border:2px solid white;
    border-radius:6px;
    color:white;
    text-align:center;
    font-size:14px;
    outline:none;
}

input::placeholder{
    color:#ccc;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    background:transparent;
    border:2px solid white;
    color:white;
    border-radius:6px;
    font-size:15px;
    cursor:pointer;
}

button:hover{
    background:white;
    color:black;
}

#msg{
    margin-top:12px;
    font-size:14px;
    color:#ff6b6b;
}
</style>
</head>

<body>

<div class="box">
    <h2>إنشاء حساب</h2>

    <input id="username" placeholder="اسم المستخدم">
    <input id="password" type="password" placeholder="كلمة المرور">

    <button onclick="register()">تسجيل</button>
    <p id="msg"></p>
</div>

<script>
function register(){
    const msg = document.getElementById("msg");

    fetch("/register",{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded"},
        body:"username="+username.value+"&password="+password.value
    })
    .then(res => res.text().then(t => ({status:res.status,text:t})))
    .then(r=>{
        if(r.status===201){
            msg.style.color="lightgreen";
            msg.innerText="تم إنشاء الحساب بنجاح";
            setTimeout(()=>location.href="/",1500);
        }else if(r.status===409){
            msg.innerText="اسم المستخدم موجود مسبقًا";
        }else{
            msg.innerText="حدث خطأ";
        }
    })
}
</script>

</body>
</html>
