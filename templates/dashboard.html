<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<style>
body{
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
    font-family:Arial;
    background: radial-gradient(circle at top, #111, #000);
}

.box{
    width:320px;
    padding:30px 25px;
    text-align:center;
    border:2px solid white;
    border-radius:12px;
    background:transparent;
    color:white;
}

h2{
    font-weight:normal;
    margin-bottom:10px;
}

p{
    color:#ccc;
    font-size:14px;
}
</style>
</head>

<body>

<div class="box">
    <h2>مرحبًا {{ username }}</h2>
    <p>تم تسجيل الدخول بنجاح</p>
</div>

</body>
</html>
